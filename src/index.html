<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Матвей Соколов</title>
		<link rel="stylesheet" href="./assets/styles/index.scss" />
	</head>
	<body>
		<header class="header">
			<div class="container">
				<a class="logo-link" href="#">
					<div class="logo-link__group">
						<img src="./assets/images/logo.svg" alt="logo" />
						<span>SOKOLSTYLZ</span>
					</div>
				</a>

				<button class="burger" aria-label="Открыть меню">
					<img
						class="burger__icon burger__icon-menu"
						src="./assets/images/menu.svg"
						alt=""
					/>

					<img
						class="burger__icon burger__icon-close"
						src="./assets/images/сlose.svg"
						alt=""
					/>
				</button>

				<nav class="nav">
					<ul class="header__list">
						<!-- ПРОЕКТЫ -->
						<li>
							<a href="#" class="nav__link">
								<span class="bracket left">[</span>

								<span class="word">
									<span class="letter"><span>П</span><span>П</span></span>
									<span class="letter"><span>Р</span><span>Р</span></span>
									<span class="letter"><span>О</span><span>О</span></span>
									<span class="letter"><span>Е</span><span>Е</span></span>
									<span class="letter"><span>К</span><span>К</span></span>
									<span class="letter"><span>Т</span><span>Т</span></span>
									<span class="letter"><span>Ы</span><span>Ы</span></span>
								</span>

								<span class="bracket right">]</span>
							</a>
						</li>

						<!-- ОБО МНЕ -->
						<li>
							<a href="#" class="nav__link">
								<span class="bracket left">[</span>

								<span class="word">
									<span class="letter"><span>О</span><span>О</span></span>
									<span class="letter"><span>Б</span><span>Б</span></span>
									<span class="letter"><span>О</span><span>О</span></span>
									<span class="letter"
										><span>&nbsp;</span><span>&nbsp;</span></span
									>
									<span class="letter"><span>М</span><span>М</span></span>
									<span class="letter"><span>Н</span><span>Н</span></span>
									<span class="letter"><span>Е</span><span>Е</span></span>
								</span>

								<span class="bracket right">]</span>
							</a>
						</li>

						<!-- КАК Я РАБОТАЮ -->
						<li>
							<a href="#" class="nav__link">
								<span class="bracket left">[</span>

								<span class="word">
									<span class="letter"><span>К</span><span>К</span></span>
									<span class="letter"><span>А</span><span>А</span></span>
									<span class="letter"><span>К</span><span>К</span></span>
									<span class="letter"
										><span>&nbsp;</span><span>&nbsp;</span></span
									>
									<span class="letter"><span>Я</span><span>Я</span></span>
									<span class="letter"
										><span>&nbsp;</span><span>&nbsp;</span></span
									>
									<span class="letter"><span>Р</span><span>Р</span></span>
									<span class="letter"><span>А</span><span>А</span></span>
									<span class="letter"><span>Б</span><span>Б</span></span>
									<span class="letter"><span>О</span><span>О</span></span>
									<span class="letter"><span>Т</span><span>Т</span></span>
									<span class="letter"><span>А</span><span>А</span></span>
									<span class="letter"><span>Ю</span><span>Ю</span></span>
								</span>

								<span class="bracket right">]</span>
							</a>
						</li>
					</ul>
					<div class="nav__mobile-actions"></div>
				</nav>
				<div class="header__links">
					<a class="btn" href="./assets/files/Resume.pdf" target="_blank">
						РЕЗЮМЕ
					</a>
					<a href="https://t.me/sokolstylz" class="btn-icon" target="_blank">
						<div class="btn-icon__group">
							<span>СВЯЗАТЬСЯ</span>
							<img
								class="btn-icon__img"
								src="./assets/images/arrow.svg"
								alt="icon"
							/>
						</div>
					</a>
				</div>
			</div>
		</header>
		<script type="module" src="./assets/js/main.js"></script>
	</body>
</html>
